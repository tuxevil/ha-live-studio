name: Validate integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace --entrypoint python3 ghcr.io/home-assistant/home-assistant:2026.10.1 tests/smoke_ha.py
      - run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace --entrypoint python3 ghcr.io/home-assistant/home-assistant:2026.10.1 tests/test_ai.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check custom_components/live_studio/frontend/live-studio-overlay-card.js
      - run: node tests/overlay_card.cjs
      - run: node --check custom_components/live_studio/frontend/live-studio-cameras-card.js
      - run: node tests/cameras_card.cjs
